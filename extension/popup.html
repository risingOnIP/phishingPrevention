<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Prevention</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 20px;
            width: 600px;

            background-color: lightblue;
            font-family: 'Roboto Mono', monospace;

            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
        }

        /* Background follows the verdict status set by popup.js. */
        body[data-status="phishing"] {
            background-color: #FECACA;
        }

        body[data-status="error"],
        body[data-status="skipped"] {
            background-color: #E5E7EB;
        }

        .img-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        img.shield {
            height: 120px;
        }

        .chars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 42px;
        }

        .text {
            font-size: 32px;
            font-weight: bold;
            color: black;
        }

        .message {
            margin: 0;
            text-align: center;
            font-size: 14px;
        }

        .evidence {
            margin: 0;
            padding-left: 20px;
            font-size: 13px;
        }

        .evidence:empty {
            display: none;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 30px;
        }

        .buttons button {
            width: 35%;
            border-radius: 30px;
            border: 1px black solid;
            color: black;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            padding: 10px 2px;
            background-color: transparent;
            transition: all ease 350ms;
        }

        .buttons button:hover {
            color: white;
            background-color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="img-wrapper"><img class="shield" src="Shield.png" alt="Phishing Prevention shield"></div>
    <div class="chars"></div>
    <p class="message"></p>
    <ul class="evidence"></ul>

    <div class="buttons">
        <button id="close">Close Tab</button>
        <button id="dismiss">Dismiss</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
